name = "sebpay-proxy"
main = "sebpay-proxy.js"
compatibility_date = "2024-01-01"

# Environment variables
# These should be set as secrets in Cloudflare Workers dashboard
# Use: wrangler secret put SEBPAY_API_KEY
# Use: wrangler secret put SEBPAY_SECRET_KEY
# Use: wrangler secret put LEEKPAY_SECRET_KEY

# Conserver les variables définies dans le tableau de bord Cloudflare lors d'un déploiement
keep_vars = true

[vars]
# Relais AfribaPay sur le VPS (IP fixe 185.97.144.133 autorisée chez AfribaPay)
# Configuration nginx : /etc/nginx/sites-available/srv563641.hstgr.cloud
AFRIBAPAY_RELAY_URL = "https://srv563641.hstgr.cloud"

# Production environment
[env.production]
name = "sebpay-proxy-prod"

# Development environment
[env.development]
name = "sebpay-proxy-dev"
