# nginx de l'hôte (VPS) : /etc/nginx/sites-available/srv563641.hstgr.cloud
# Nom d'hôte du VPS, deux usages pour TikTok Coins (GitHub PayOol/TikTokCoins-PayOol) :
#  1. /afribapay/v1/* et /afribapay-sandbox/v1/* : relais AfribaPay (20 novembre 2026).
#     AfribaPay n'autorise que des IP déclarées ; le Worker Cloudflare « sebpay-proxy » n'a pas d'IP fixe.
#     Le Worker garde les clés ; nginx retransmet tel quel à AfribaPay en sortant par l'IPv4 du VPS
#     (185.97.144.133). Aucune clé stockée ici. Accès réservé à Cloudflare (snippets/cloudflare-only.conf).
#  2. Tout le reste : admin TikTok Coins (payouts), conteneur tiktokcoins_admin sur 127.0.0.1:8093 (21 novembre 2026).
# Certificat Let's Encrypt obtenu par certbot --webroot (/var/www/letsencrypt).

limit_req_zone $binary_remote_addr zone=afribapay_relay:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tkc_admin_login:1m rate=10r/m;

# Journal sans $remote_user : ne pas enregistrer l'identifiant API AfribaPay.
log_format afribapay_relay '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name srv563641.hstgr.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name srv563641.hstgr.cloud;
    ssl_certificate /etc/letsencrypt/live/srv563641.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv563641.hstgr.cloud/privkey.pem;

    access_log /var/log/nginx/srv563641.access.log afribapay_relay;
    error_log  /var/log/nginx/srv563641.error.log;

    # Résolution IPv4 uniquement : AfribaPay doit voir l'IPv4 du VPS.
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    client_max_body_size 64k;

    # ── 1. Relais AfribaPay (Cloudflare uniquement) ──
    location ~ ^/afribapay/v1/(.*)$ {
        include /etc/nginx/snippets/cloudflare-only.conf;
        limit_req zone=afribapay_relay burst=20 nodelay;
        set $afribapay_upstream api.afribapay.com;
        proxy_pass https://$afribapay_upstream/v1/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name api.afribapay.com;
        proxy_set_header Host api.afribapay.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location ~ ^/afribapay-sandbox/v1/(.*)$ {
        include /etc/nginx/snippets/cloudflare-only.conf;
        limit_req zone=afribapay_relay burst=20 nodelay;
        set $afribapay_sandbox_upstream api-sandbox.afribapay.com;
        proxy_pass https://$afribapay_sandbox_upstream/v1/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name api-sandbox.afribapay.com;
        proxy_set_header Host api-sandbox.afribapay.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # ── 2. Admin TikTok Coins ──
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ /\.(?!well-known) { deny all; }

    location ~ ^/(login|setup)$ {
        limit_req zone=tkc_admin_login burst=10 nodelay;
        include /etc/nginx/snippets/tiktokcoins-admin-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/tiktokcoins-admin-proxy.conf;
    }
}
