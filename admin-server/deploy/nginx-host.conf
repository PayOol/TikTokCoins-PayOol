# nginx de l'hôte (VPS) : /etc/nginx/sites-available/tiktokcoins-admin
# Admin TikTok Coins (conteneur tiktokcoins_admin sur 127.0.0.1:8093).
# Certificat Let's Encrypt obtenu par certbot --webroot (/var/www/letsencrypt).
# Remplacer __DOMAIN__ par le nom de domaine de l'admin.

limit_req_zone $binary_remote_addr zone=tkc_admin_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/tiktokcoins-admin.access.log;
    error_log  /var/log/nginx/tiktokcoins-admin.error.log;
    client_max_body_size 64k;

    location ~ /\.(?!well-known) { deny all; }

    location ~ ^/(login|setup)$ {
        limit_req zone=tkc_admin_login burst=10 nodelay;
        include /etc/nginx/snippets/tiktokcoins-admin-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/tiktokcoins-admin-proxy.conf;
    }
}
